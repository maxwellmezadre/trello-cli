name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bun:
    name: Type-check & test (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test

  node:
    name: Compat smoke (Node LTS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # Prova que Node ≥ 18 carrega o CLI (TS ESM) via tsx.
      - run: npx --yes tsx src/bin.ts --version
