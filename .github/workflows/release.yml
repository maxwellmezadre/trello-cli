name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # criar a Release e anexar binários
  id-token: write # provenance do npm

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test

  npm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          # Trusted publishing (OIDC) exige npm >= 11.5.1; Node 24 traz 11.13.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run build:dist
      # Sem NODE_AUTH_TOKEN: a credencial é um token OIDC de vida curta, emitido
      # no publish e válido só para este workflow. A provenance sai automática,
      # por isso `--provenance` também saiu.
      - run: npm publish --access public

  binaries:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            asset: trello-linux-x64
          - os: macos-latest
            target: bun-darwin-arm64
            asset: trello-darwin-arm64
          - os: windows-latest
            target: bun-windows-x64
            asset: trello-windows-x64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun build --compile --target=${{ matrix.target }} src/bin.ts --outfile ${{ matrix.asset }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
